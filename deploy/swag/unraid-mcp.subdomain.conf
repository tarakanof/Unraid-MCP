# Unraid MCP — SWAG drop-in reverse-proxy config.
#
# Drop this file into SWAG's proxy-confs directory:
#     /config/nginx/proxy-confs/unraid-mcp.subdomain.conf
# then restart the SWAG container. See docs/connectivity.md (SWAG recipe) for
# DNS, UNRAID_MCP_ALLOWED_HOSTS, and end-to-end verification steps.
#
# Result: https://unraid-mcp.<your-domain> proxies to the unraid-mcp container
# on port 6750. The MCP endpoint is https://unraid-mcp.<your-domain>/mcp; the
# unauthenticated liveness probe is https://unraid-mcp.<your-domain>/health.
# To use a different subdomain (e.g. mcp.<your-domain>), rename this file to
# mcp.subdomain.conf AND change `server_name mcp.*;` below to match.
#
# Make sure your DNS has a CNAME for `unraid-mcp` pointing at your domain.

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name unraid-mcp.*;

    include /config/nginx/ssl.conf;

    client_max_body_size 0;

    # enable for Authelia (requires authelia-location.conf in the location block)
    #include /config/nginx/authelia-server.conf;

    # enable for Authentik (requires authentik-location.conf in the location block)
    #include /config/nginx/authentik-server.conf;

    location / {
        # An optional extra auth layer in front of the mandatory bearer token.
        # The bearer token is required regardless — never remove it.
        # enable the next two lines for http auth
        #auth_basic "Restricted";
        #auth_basic_user_file /config/nginx/.htpasswd;

        # enable for Authelia (requires authelia-server.conf in the server block)
        #include /config/nginx/authelia-location.conf;

        # enable for Authentik (requires authentik-server.conf in the server block)
        #include /config/nginx/authentik-location.conf;

        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;

        # `unraid-mcp` resolves via Docker DNS only if SWAG and the MCP
        # container share a user-defined Docker network. Otherwise set
        # $upstream_app to the Unraid host's LAN IP (e.g. 192.168.1.10).
        set $upstream_app unraid-mcp;
        set $upstream_port 6750;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;

        # --- Streamable-HTTP / SSE requirements ------------------------------
        # MCP streamable-HTTP responses are Server-Sent Event streams. nginx
        # buffers proxied responses by default, which stalls the stream until
        # it closes; turn buffering off so events flush to the client live.
        proxy_buffering off;
        # MCP streamable-HTTP is SSE over plain HTTP/1.1 (not a WebSocket
        # upgrade), so buffering-off + HTTP/1.1 are the parts that matter here.
        # proxy.conf already sets proxy_http_version 1.1; kept explicit for clarity.
        proxy_http_version 1.1;
        # SSE streams are long-lived — don't let nginx time them out mid-stream.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # proxy.conf sets `proxy_set_header Host $host;`, so the upstream sees
        # the public name (e.g. unraid-mcp.example.com). Add that exact name to
        # UNRAID_MCP_ALLOWED_HOSTS on the MCP container or its Host check 421s.
    }
}
