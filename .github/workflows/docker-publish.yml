name: Publish Docker image

# Builds the container and pushes it to Docker Hub when a GitHub Release is
# published (and on manual dispatch). Tag the release `vX.Y.Z` to get semver
# image tags plus `latest`.
#
# Required repository secrets:
#   DOCKERHUB_USERNAME  - your Docker Hub username (also the image namespace)
#   DOCKERHUB_TOKEN     - a Docker Hub access token (Account Settings -> Security)
# The image is published as docker.io/<DOCKERHUB_USERNAME>/unraid-mcp.

on:
  release:
    types: [published]
  workflow_dispatch:

env:
  IMAGE_NAME: unraid-mcp

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - name: Log in to Docker Hub
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Derive image tags and labels
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6
        with:
          images: docker.io/${{ vars.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=ref,event=branch
            type=sha,format=short,prefix=sha-

      - name: Build and push
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: mode=max

      # Render a job summary on the run page (Actions → run → Summary).
      # The Docker Hub namespace shows as *** because DOCKERHUB_USERNAME is a
      # secret; store it as a repo variable (vars.) instead if you want it shown.
      - name: Job summary
        if: ${{ steps.build.outcome == 'success' }}
        run: |
          IMAGE="docker.io/${{ vars.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}"
          {
            echo "## 📦 Published \`${{ env.IMAGE_NAME }}\` \`${{ steps.meta.outputs.version }}\`"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Registry | Docker Hub |"
            echo "| Image | \`$IMAGE\` |"
            echo "| Version | \`${{ steps.meta.outputs.version }}\` |"
            echo "| Digest | \`${{ steps.build.outputs.digest }}\` |"
            echo "| Platforms | \`linux/amd64\`, \`linux/arm64\` |"
            echo "| SBOM + provenance | attached |"
            echo ""
            echo "**Tags**"
            echo ""
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo ""
            echo "**Pull**"
            echo ""
            echo '```sh'
            echo "docker pull $IMAGE:${{ steps.meta.outputs.version }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
