name: Publish Docker image

# Builds the container and pushes it to Docker Hub when a GitHub Release is
# published (and on manual dispatch). Tag the release `vX.Y.Z` to get semver
# image tags plus `latest`.
#
# Required repository secrets:
#   DOCKERHUB_USERNAME  - your Docker Hub username (also the image namespace)
#   DOCKERHUB_TOKEN     - a Docker Hub access token (Account Settings -> Security)
# The image is published as docker.io/<DOCKERHUB_USERNAME>/unraid-mcp.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 1.2.3), without the leading v"
        required: false
        type: string
  workflow_call:
    inputs:
      version:
        description: "Version to publish (e.g. 1.2.3), without the leading v"
        required: true
        type: string

env:
  IMAGE_NAME: unraid-mcp

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to Docker Hub
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Resolve the version to publish. For release events it comes from the
      # git tag (refs/tags/vX.Y.Z); for workflow_call / workflow_dispatch it is
      # provided as an input. Exposed as steps.version.outputs.value (no "v").
      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            value="${INPUT_VERSION#v}"
          else
            value="${REF_NAME#v}"
          fi
          echo "value=$value" >> "$GITHUB_OUTPUT"

      - name: Derive image tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: docker.io/${{ vars.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=auto
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.value }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.value }}
            type=semver,pattern={{major}},value=${{ steps.version.outputs.value }}
            type=ref,event=branch
            type=sha,format=short,prefix=sha-

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: mode=max

      # Render a job summary on the run page (Actions → run → Summary).
      # The Docker Hub namespace shows as *** because DOCKERHUB_USERNAME is a
      # secret; store it as a repo variable (vars.) instead if you want it shown.
      - name: Job summary
        if: ${{ steps.build.outcome == 'success' }}
        run: |
          IMAGE="docker.io/${{ vars.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}"
          {
            echo "## 📦 Published \`${{ env.IMAGE_NAME }}\` \`${{ steps.meta.outputs.version }}\`"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Registry | Docker Hub |"
            echo "| Image | \`$IMAGE\` |"
            echo "| Version | \`${{ steps.meta.outputs.version }}\` |"
            echo "| Digest | \`${{ steps.build.outputs.digest }}\` |"
            echo "| Platforms | \`linux/amd64\`, \`linux/arm64\` |"
            echo "| SBOM + provenance | attached |"
            echo ""
            echo "**Tags**"
            echo ""
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo ""
            echo "**Pull**"
            echo ""
            echo '```sh'
            echo "docker pull $IMAGE:${{ steps.meta.outputs.version }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
