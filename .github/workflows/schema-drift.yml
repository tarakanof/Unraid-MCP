name: Schema drift

# Validates every GraphQL operation in queries.py against the upstream
# unraid/api schema. Runs weekly (and on demand) rather than per-PR because it
# depends on a network download. A failure here means upstream renamed/removed
# a field we still use — the failed run is the notification; fix queries.py.

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Check schema drift
        run: uv run python scripts/check_schema_drift.py
