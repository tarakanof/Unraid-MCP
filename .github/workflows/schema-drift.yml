name: Schema drift

# Validates every GraphQL operation in queries.py against the upstream
# unraid/api schema. Runs weekly (and on demand) rather than per-PR because it
# depends on a network download. A failure here means upstream renamed/removed
# a field we still use — the failed run is the notification; fix queries.py.

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Check schema drift
        run: uv run python scripts/check_schema_drift.py
