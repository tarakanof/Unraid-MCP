name: Live smoke (manual)

# Opt-in, manual-only end-to-end smoke suite against a REAL Unraid box.
# Deliberately NOT triggered on push/pull_request so no credentials ever flow
# through hosted PR/push CI. Intended for a self-hosted runner that can reach
# your Unraid server; provide UNRAID_API_URL / UNRAID_API_KEY as repo or
# environment secrets before running.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    # Change to a self-hosted label that can reach your Unraid server, e.g.
    # `runs-on: [self-hosted, unraid]`.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Live smoke tests
        env:
          UNRAID_LIVE_TEST: "1"
          UNRAID_API_URL: ${{ secrets.UNRAID_API_URL }}
          UNRAID_API_KEY: ${{ secrets.UNRAID_API_KEY }}
        run: uv run pytest -m live -q
