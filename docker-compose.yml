# Docker Compose / Portainer deployment of the Unraid MCP server.
# The image defaults to the streamable-HTTP transport on port 6750.
# Copy this, fill in the values, then: docker compose up -d
services:
  unraid-mcp:
    image: tarakanof/unraid-mcp:latest
    container_name: unraid-mcp
    restart: unless-stopped
    ports:
      - "6750:6750"
    environment:
      # --- required ---
      UNRAID_API_URL: "https://YOUR_UNRAID_IP/graphql"
      UNRAID_API_KEY: "your-unraid-api-key"
      # Bearer token MCP clients must send. Leave unset to auto-generate one
      # (printed to the logs) — but it changes on every restart, so set a fixed
      # long random value for stable clients (e.g. `openssl rand -hex 32`).
      UNRAID_MCP_BEARER_TOKEN: "change-me-to-a-long-random-token"
      # --- TLS to the Unraid API ---
      # Unraid's local API usually uses a self-signed cert; disable verification
      # or, better, mount a CA bundle and set UNRAID_CA_BUNDLE.
      UNRAID_VERIFY_SSL: "false"
      # --- safety (read-only by default) ---
      UNRAID_MCP_ALLOW_MUTATIONS: "false"
      UNRAID_MCP_ALLOW_RAW_QUERY: "false"
      # --- optional hardening / misc ---
      # UNRAID_MCP_ALLOWED_HOSTS: "tower.local:6750,10.0.0.5:6750"
      # UNRAID_MCP_TLS_CERT: "/certs/cert.pem"
      # UNRAID_MCP_TLS_KEY: "/certs/key.pem"
      UNRAID_MCP_LOG_LEVEL: "INFO"
    # volumes:
    #   - /mnt/user/appdata/unraid-mcp/certs:/certs:ro
