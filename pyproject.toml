[project]
name = "unraid-mcp"
version = "0.7.0"
description = "An MCP server for monitoring and managing Unraid through its official GraphQL API"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "dtarakanov" }]
keywords = ["unraid", "mcp", "model-context-protocol", "graphql", "homelab"]
dependencies = [
    "mcp>=2.0.0,<3",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.15.0",
    "graphql-core>=3.2.11",
    "websockets>=16.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.16.2",
]

[project.scripts]
unraid-mcp = "unraid_mcp.cli:main"

[project.urls]
Homepage = "https://github.com/tarakanof/Unraid-MCP"
Issues = "https://github.com/tarakanof/Unraid-MCP/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/unraid_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W", "C4", "SIM"]
ignore = ["B008"]  # FastMCP/Pydantic use callables in defaults intentionally

[tool.ruff.lint.per-file-ignores]
# GraphQL operation strings are an embedded DSL; long single-line selections
# are clearer than artificially wrapped ones.
"src/unraid_mcp/queries.py" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Exclude the env-gated live smoke suite by default so plain `pytest` and CI
# never touch the network. Run it explicitly with `pytest -m live` (the
# command-line -m overrides this one).
addopts = "-ra -m 'not live'"
markers = [
    "live: end-to-end smoke tests against a real Unraid server (opt-in; requires UNRAID_LIVE_TEST=1). Excluded by default.",
]
